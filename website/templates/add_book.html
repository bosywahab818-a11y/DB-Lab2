<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container" style="max-width: 500px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2>Add New Book</h2>
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    <form method="POST" enctype="multipart/form-data">
        <p><label><strong>Title:</strong></label><br><input type="text" name="title" required style="width: 100%; padding: 8px; margin-top: 5px;"></p>
        <p><label><strong>Price ($):</strong></label><br><input type="number" step="0.01" name="price" required style="width: 100%; padding: 8px; margin-top: 5px;"></p>
        <p><label><strong>Author:</strong></label><br>
            <select name="author_id" required style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="" disabled selected>Select Author</option>
                {% for author in authors %}
                    <option value="{{ author.author_id }}">{{ author.name }}</option>
                {% endfor %}
            </select>
        </p>
        <p><label><strong>Cover Image:</strong></label><br><input type="file" name="image" accept="image/*" style="margin-top: 5px;"></p>
        <br>
        <button type="submit" style="background: #28a745; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Book</button>
        <a href="{{ url_for('library') }}" style="margin-left: 10px; color: #666;">Cancel</a>
    </form>
</div>
</body>
</html>
