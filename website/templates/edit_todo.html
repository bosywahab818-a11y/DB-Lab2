<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Todo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Edit Todo
            </h1>

            {% if error %}

                <p class="error">
                    {{ error }}
                </p>

            {% endif %}

            <form method="POST">

                <input
                    type="text"
                    name="title"
                    value="{{ todo.title }}"
                    maxlength="200"
                    placeholder="Todo title"
                    required
                >

                <input
                    type="date"
                    name="due_date"
                    value="{{ todo.due_date if todo.due_date else '' }}"
                    class="date-input"
                >

                <button
                    type="submit"
                    class="add-btn"
                >
                    Save Changes
                </button>

            </form>

            <a
                href="/todos"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </div>

</body>

</html>
